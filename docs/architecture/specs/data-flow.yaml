# Data flow: vendor data -> chain store -> features/signals -> engine -> ledger -> analytics -> JSON -> app.
# Table names match data-model.erd.yaml. Interim diagram schema (see ../README.md).
# Revised after the M0 review: signals are computed in the loop from the MarketView; quotes are de-Americanised; DoltHub mask for the surface-gap runs.
kind: flow
id: data-flow
title: "Data flow from vendor files to the app"
lanes:
  - {id: vendors, label: "Vendors"}
  - {id: ingest, label: "Ingest and clean (M1)"}
  - {id: features, label: "Pricing build (M2)"}
  - {id: simulation, label: "Simulation (M3 to M5)"}
  - {id: results, label: "Results (M6)"}
  - {id: presentation, label: "Presentation"}
nodes:
  - {id: v_optionsdx, label: "raw_optionsdx_eod", type: source, lane: vendors, note: "33 bracketed columns, one wide row per date, expiry, strike"}
  - {id: v_dolthub, label: "raw_dolthub_option_chain", type: source, lane: vendors, note: "13 columns; read-only; filter on date first"}
  - {id: v_yf, label: "yfinance SPY OHLC + dividends", type: external, lane: vendors}
  - {id: v_fred, label: "FRED DGS3MO", type: external, lane: vendors}
  - {id: v_cboe, label: "Cboe VIX and VIX3M", type: external, lane: vendors, note: "VIX3M availability verified in M1"}
  - {id: i_ref, label: "Load reference series", type: process, lane: ingest}
  - {id: s_ref, label: "underlying_bars, rates, dividends, vix_daily", type: store, lane: ingest}
  - {id: i_cal, label: "Build trading_calendar from SPY bars", type: process, lane: ingest, note: "Never from chain dates (12 closure-dated snapshots, 44,926 rows)"}
  - {id: i_load, label: "Load chains + pin schema", type: process, lane: ingest}
  - {id: i_flags, label: "Reshape long, OSI symbol, quality_flags", type: process, lane: ingest, note: "Bitmask in ADR-0009"}
  - {id: g_quality, label: "Quality report within tolerance?", type: decision, lane: ingest}
  - {id: s_quotes, label: "option_quotes", type: store, lane: ingest}
  - {id: i_mask, label: "DoltHub sampling mask for surface-gap runs", type: process, lane: ingest, note: "Keep only the expiry and strike pairs DoltHub lists that date, 2020-2023 (ADR-0009)"}
  - {id: f_forward, label: "Parity forward per expiry, de-Americanised", type: process, lane: features, note: "CRR early-exercise premium removed from 10 near-K* pairs, then median F_K over 5 strikes near K* (ADR-0008)"}
  - {id: f_iv, label: "IV solve on de-Americanised OTM mids", type: process, lane: features, note: "Premium removed within |k| 0.15; Newton then bisection"}
  - {id: f_smile, label: "Smile nodes in total variance", type: process, lane: features, note: "Wing, cross-expiry and tenor rules applied at mark time (ADR-0004)"}
  - {id: s_iv, label: "expiry_forwards, quote_iv, smile_fits", type: store, lane: features}
  - {id: e_view, label: "MarketView as_of t", type: process, lane: simulation, note: "LookAheadError after t; SplitError past the split end"}
  - {id: e_sig, label: "Signals from the view: RV, HAR/GARCH, IV30 minus RV forecast", type: process, lane: simulation, note: "Causal; expanding window from 2000, refit monthly on data up to t (ADR-0001)"}
  - {id: e_loop, label: "Daily loop: fills, expiry, marks, hedge, risk, orders", type: process, lane: simulation, note: "Order of steps in engine-daily-loop.sequence.mmd"}
  - {id: s_ledger, label: "runs, signals, orders, order_legs, fills, positions, lots, position_marks, hedges, expiry_events, risk_events, greeks_snapshots, daily_pnl", type: store, lane: simulation}
  - {id: r_metrics, label: "Metrics, PSR/DSR, regimes, stress windows", type: process, lane: results}
  - {id: r_attr, label: "Greek P&L attribution", type: process, lane: results}
  - {id: r_grid, label: "Spot x vol stress grid", type: process, lane: results, note: "Full revaluation"}
  - {id: r_export, label: "Export + JSON Schema validation", type: process, lane: results}
  - {id: a_json, label: "manifest.json + dataset JSON files", type: artifact, lane: presentation}
  - {id: u_app, label: "React app renders", type: ui, lane: presentation}
edges:
  - {from: v_yf, to: i_ref, label: "OHLC, dividends"}
  - {from: v_fred, to: i_ref, label: "yield, percent"}
  - {from: v_cboe, to: i_ref, label: "daily closes"}
  - {from: i_ref, to: s_ref, label: "typed tables"}
  - {from: s_ref, to: i_cal, label: "SPY sessions"}
  - {from: v_optionsdx, to: i_load, label: "parquet"}
  - {from: v_dolthub, to: i_load, label: "dolt sql, read-only"}
  - {from: i_load, to: i_flags, label: "wide rows"}
  - {from: i_cal, to: i_flags, label: "session check, relabel rule"}
  - {from: s_ref, to: i_flags, label: "SPY close for UNDERLYING_MISMATCH"}
  - {from: i_flags, to: g_quality, label: "flag counts"}
  - {from: g_quality, to: s_quotes, label: "pass"}
  - {from: g_quality, to: i_load, label: "fail: fix loader"}
  - {from: s_quotes, to: f_forward, label: "call and put mids"}
  - {from: s_ref, to: f_forward, label: "r_cc, dividends"}
  - {from: f_forward, to: f_iv, label: "F, DF, tau"}
  - {from: s_quotes, to: f_iv, label: "OTM mids"}
  - {from: f_iv, to: f_smile, label: "IV by strike"}
  - {from: f_smile, to: s_iv, label: "derived tables"}
  - {from: f_forward, to: s_iv, label: "forwards"}
  - {from: s_quotes, to: e_view, label: "quotes for t"}
  - {from: s_quotes, to: i_mask, label: "OptionsDX and DoltHub rows, 2020-2023"}
  - {from: i_mask, to: e_view, label: "masked chain, chain_mask dolthub"}
  - {from: s_iv, to: e_view, label: "surface for t"}
  - {from: s_ref, to: e_view, label: "S, r, dividends, VIX"}
  - {from: e_view, to: e_sig, label: "SPY bars, VIX, surface up to t"}
  - {from: e_sig, to: e_loop, label: "signal values at t"}
  - {from: e_view, to: e_loop, label: "one session"}
  - {from: e_loop, to: s_ledger, label: "append rows"}
  - {from: s_ledger, to: r_metrics, label: "daily_pnl"}
  - {from: s_ledger, to: r_attr, label: "position_marks"}
  - {from: s_ledger, to: r_grid, label: "lots at as_of"}
  - {from: r_metrics, to: r_export, label: "metrics"}
  - {from: r_attr, to: r_export, label: "pnl_attribution"}
  - {from: r_grid, to: r_export, label: "stress_grid"}
  - {from: s_iv, to: r_export, label: "surface_frames"}
  - {from: s_ledger, to: r_export, label: "blotter, positions, greeks"}
  - {from: r_export, to: a_json, label: "write"}
  - {from: a_json, to: u_app, label: "fetch"}
