# End-to-end components of vol-strategy-backtester. Interim diagram schema (see ../README.md).
# Decisions referenced: ADR-0001 (stack, module boundaries, JSON contract), ADR-0009 (sources).
# Revised after the M0 review: volbt.build owns the pricing build; signals are computed from the MarketView.
kind: flow
id: architecture
title: "vol-strategy-backtester: components"
lanes:
  - {id: sources, label: "Vendor sources (outside the repo)"}
  - {id: store, label: "Chain store (M1)"}
  - {id: core, label: "Pricing and signals (M2, M4)"}
  - {id: sim, label: "Simulation (M3 to M5)"}
  - {id: results, label: "Analytics and export (M6)"}
  - {id: app, label: "App (visualises only)"}
nodes:
  - {id: src_optionsdx, label: "Kaggle OptionsDX SPY EOD 2010-2023", type: source, lane: sources, note: "14 parquet files, 9,468,584 rows, 16:00 ET snapshots"}
  - {id: src_dolthub, label: "DoltHub option_chain SPY 2019-2026", type: source, lane: sources, note: "Shared read-only dolt clone; no volume, sizes or underlying"}
  - {id: src_yf, label: "yfinance SPY bars and dividends", type: external, lane: sources, note: "Unadjusted close, auto_adjust=False"}
  - {id: src_fred, label: "FRED DGS3MO", type: external, lane: sources, note: "3-month constant-maturity yield, investment basis"}
  - {id: src_cboe, label: "Cboe VIX history CSV", type: external, lane: sources}
  - {id: st_raw, label: "Raw vendor files under VOL_DATA_DIR", type: store, lane: store, note: "Never modified, never committed"}
  - {id: p_data, label: "volbt.data: load, calendar, quality flags", type: process, lane: store, note: "Schema pin; long format; OSI symbols; flag rather than drop"}
  - {id: st_clean, label: "Clean parquet + DuckDB", type: store, lane: store, note: "option_quotes, underlying_bars, rates, dividends, vix_daily, trading_calendar"}
  - {id: p_pricing, label: "volbt.pricing: Black-76, IV, parity forward, CRR lattice, smile", type: process, lane: core, note: "Pure functions, no I/O; imports no volbt module (ADR-0001, ADR-0008)"}
  - {id: p_build, label: "volbt.build: pricing build", type: process, lane: core, note: "Reads and writes through volbt.data, calls volbt.pricing; de-Americanises quotes (ADR-0001, ADR-0008)"}
  - {id: st_derived, label: "Derived tables: quote_iv, expiry_forwards, smile_fits", type: store, lane: core}
  - {id: p_signals, label: "volbt.signals: RV, HAR/GARCH, IV30, VRP spread", type: process, lane: core, note: "Causal: called each session with the MarketView; monthly refits on data up to t (ADR-0001)"}
  - {id: p_view, label: "MarketView as_of t", type: process, lane: sim, note: "Protocol in volbt.view, implemented in volbt.data; LookAheadError after t, SplitError past the split end"}
  - {id: p_strat, label: "volbt.strategies: structures, entry and exit rules", type: process, lane: sim}
  - {id: p_risk, label: "volbt.risk: greek and stress budgets, sizing, margin", type: process, lane: sim, note: "ADR-0006 (greeks, stress grid cells), ADR-0007 (net margin requirement)"}
  - {id: p_engine, label: "volbt.engine: daily loop, fills, marks, expiry, hedge", type: process, lane: sim, note: "ADR-0002 to ADR-0005"}
  - {id: st_ledger, label: "Run ledger parquet under runs/run_id", type: store, lane: sim}
  - {id: p_analytics, label: "volbt.analytics: metrics, attribution, regimes, stress grid", type: process, lane: results, note: "Reads ledger tables only (ADR-0010)"}
  - {id: p_export, label: "volbt.export + tools/export_app_data.py", type: process, lane: results, note: "JSON Schema validation before write"}
  - {id: a_json, label: "app/public/data JSON: manifest + datasets", type: artifact, lane: results, note: "Envelope: schema_version, generated_at, source_commit"}
  - {id: ui_app, label: "Vite + React 19 + three.js viewer", type: ui, lane: app, note: "Parses, validates and renders; never computes a result"}
edges:
  - {from: src_optionsdx, to: st_raw, label: "copy as delivered"}
  - {from: src_dolthub, to: st_raw, label: "read-only SQL"}
  - {from: src_yf, to: st_raw, label: "fetch"}
  - {from: src_fred, to: st_raw, label: "fetch"}
  - {from: src_cboe, to: st_raw, label: "fetch"}
  - {from: st_raw, to: p_data, label: "raw rows"}
  - {from: p_data, to: st_clean, label: "flagged long quotes + reference data"}
  - {from: st_clean, to: p_build, label: "mids, SPY close, r, dividends"}
  - {from: p_pricing, to: p_build, label: "pure functions"}
  - {from: p_build, to: st_derived, label: "IV, forwards, smiles"}
  - {from: st_clean, to: p_view, label: "chain slice for t"}
  - {from: st_derived, to: p_view, label: "surface for t"}
  - {from: p_view, to: p_signals, label: "data dated up to t"}
  - {from: p_signals, to: p_strat, label: "signal values at t"}
  - {from: p_view, to: p_strat, label: "as_of t view"}
  - {from: p_strat, to: p_risk, label: "order intents"}
  - {from: p_risk, to: p_engine, label: "scaled or rejected orders"}
  - {from: p_view, to: p_engine, label: "quotes for fills and marks"}
  - {from: p_engine, to: st_ledger, label: "orders, fills, marks, pnl"}
  - {from: st_ledger, to: p_analytics, label: "ledger tables"}
  - {from: p_analytics, to: p_export, label: "results frames"}
  - {from: st_derived, to: p_export, label: "surface frames"}
  - {from: p_export, to: a_json, label: "versioned JSON"}
  - {from: a_json, to: ui_app, label: "fetch + parse"}
