      - {name: generated_at, type: string}
      - {name: source_commit, type: string}
      - {name: run, type: json_run, fk: json_run.run_id}
      - {name: units, type: object}
      - {name: positions, type: "array<object>", note: "{position_id, structure, opened, closed, legs[], exit_reason}"}
      - {name: dates, type: "array<string>"}
      - {name: open_count, type: "array<number>"}
  - name: json_greeks_timeline
    description: "greeks_timeline.json (M5), column-wise."
    columns:
