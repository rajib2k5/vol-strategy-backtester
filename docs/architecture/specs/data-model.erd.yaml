      - {name: generated_at, type: string}
      - {name: source_commit, type: string}
      - {name: run, type: json_run, fk: json_run.run_id}
      - {name: units, type: object}
      - {name: dates, type: "array<string>"}
      - {name: delta_usd, type: "array<number>"}
      - {name: gamma_1pct_usd, type: "array<number>"}
      - {name: vega_1vol_usd, type: "array<number>"}
      - {name: theta_1d_usd, type: "array<number>"}
      - {name: budgets, type: object}
  - name: json_pnl_attribution
