      - {name: generated_at, type: string}
      - {name: source_commit, type: string}
      - {name: run, type: json_run, fk: json_run.run_id}
      - {name: units, type: object}
      - {name: dates, type: "array<string>"}
      - {name: nav_mid, type: "array<number>"}
      - {name: nav_liq, type: "array<number>"}
      - {name: pnl_delta, type: "array<number>"}
      - {name: pnl_gamma, type: "array<number>"}
      - {name: pnl_vega, type: "array<number>"}
      - {name: pnl_theta, type: "array<number>"}
      - {name: pnl_fees, type: "array<number>"}
      - {name: pnl_interest, type: "array<number>"}
      - {name: pnl_residual, type: "array<number>"}
  - name: json_stress_grid
    description: "stress_grid.json (M6): full-revaluation spot x vol grid."
    columns:
      - {name: schema_version, type: string}
      - {name: generated_at, type: string}
      - {name: source_commit, type: string}
      - {name: run, type: json_run, fk: json_run.run_id}
      - {name: units, type: object}
      - {name: as_of, type: string}
      - {name: spot_shocks_pct, type: "array<number>"}
      - {name: vol_shocks_pts, type: "array<number>"}
      - {name: pnl_usd, type: "array<array<number>>", note: "pnl_usd[i_vol][j_spot]"}
  - name: json_metrics
    description: "metrics.json (M6)."
    columns:
      - {name: schema_version, type: string}
      - {name: generated_at, type: string}
      - {name: source_commit, type: string}
      - {name: run, type: json_run, fk: json_run.run_id}
      - {name: units, type: object}
      - {name: overall, type: object, note: "cagr, sharpe, sortino, calmar, max_dd_mid, max_dd_liq, skew, kurtosis, avg and peak margin use"}
      - {name: by_regime, type: "array<object>"}
      - {name: by_stress_window, type: "array<object>", note: "includes Aug-2024 with status NO_DATA"}
      - {name: n_trials, type: number, note: "N_raw: trials plus re-runs plus logged design choices (ADR-0010)"}
