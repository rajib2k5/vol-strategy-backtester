[project]
name = "vol-strategy-backtester"
version = "0.1.0"
description = "Learning repo: volatility-strategy backtester with a Python to React JSON contract."
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scipy==1.18.1",
  "duckdb==2.0.0",
  "pyarrow==26.0.0",
  "pyyaml==6.0.3",
  "nbformat==5.11.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ipykernel==7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# A build backend makes `uv sync` install volbt (editable) into .venv, so
# `uv run python -c "import volbt"` works everywhere, not only under pytest.
[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "volbt"
